<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu plantilla — DragonflAI Events</title>
<style>
  :root{
    --teal:#2EC4B6; --violet:#7B2FBE; --cream:#FAF9F7; --cream-2:#F3F1EE;
    --text:#1A1A2E; --text-2:#4A4A6A; --text-3:#8A8AAA; --border:#E5E0DC;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--cream); color:var(--text);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem 1.25rem;
  }
  .card{
    max-width:460px; width:100%; background:#fff; border-radius:24px;
    padding:2.5rem 2rem; box-shadow:0 10px 40px rgba(0,0,0,.06); text-align:center;
  }
  .icon{font-size:38px; margin-bottom:.75rem}
  h1{font-family:'Cormorant Garamond',Georgia,serif; font-size:28px; margin:0 0 .4rem; line-height:1.25}
  p.sub{color:var(--text-2); font-size:14.5px; line-height:1.6; margin:0 0 2rem}
  .option{
    display:block; text-decoration:none; border:1.5px solid var(--border); border-radius:16px;
    padding:1.1rem 1.25rem; margin-bottom:14px; text-align:left; transition:border-color .15s;
  }
  .option:hover{border-color:var(--teal)}
  .option-title{font-weight:600; font-size:15px; color:var(--text); display:flex; align-items:center; gap:8px}
  .option-desc{font-size:12.5px; color:var(--text-3); margin-top:4px; line-height:1.5}
  .badge{
    display:inline-block; font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    padding:2px 8px; border-radius:100px; margin-left:auto;
  }
  .badge-easy{background:#E3F7F5; color:#0F8A7E}
  .badge-pro{background:#F1E7FB; color:#7B2FBE}
  .badge-static{background:#FDF0E5; color:#B5673B}
  .footer{margin-top:1.75rem; font-size:11.5px; color:var(--text-3)}
  .footer b{color:var(--text-2)}
  .error-box{color:var(--text-2); font-size:14px; line-height:1.6}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="icon">🗞️</div>
  <h1 id="titleEl">Tu plantilla</h1>
  <p class="sub" id="subEl">Elige cómo prefieres editarla — las versiones tienen exactamente el mismo diseño.</p>
  <div id="optionsEl"></div>
  <div class="footer">Hecho con 🦋 por <b>Dragonflai Designs</b></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  Página de entrega GENÉRICA para cualquier producto que se
//  entregue en más de un formato editable (Canva, PowerPoint, Word,
//  o un PDF estático de referencia).
//
//  Se controla 100% con parámetros en la URL — no hay que tocar
//  este archivo para agregar un producto nuevo. Ejemplo de
//  template_url en Supabase para un futuro producto:
//
//  https://dragonflaievents.com/entrega-editable.html
//    ?title=Nombre%20del%20producto
//    &canva=https://canva.link/XXXXX
//    &pptx=https://.../template/archivo.pptx
//    &docx=https://.../template/archivo.docx   (opcional)
//    &pdf=https://.../template/archivo.pdf     (opcional, versión estática)
//
//  Solo agrega los parámetros que apliquen — si falta uno, esa
//  opción simplemente no se muestra.
// ══════════════════════════════════════════════════════════════

const params = new URLSearchParams(window.location.search);
const title = params.get('title') || 'Tu plantilla';
document.getElementById('titleEl').textContent = title;
document.title = title + ' — DragonflAI Events';

const OPTION_DEFS = [
  { key: 'canva', icon: '🎨', label: 'Editar en Canva', badge: ['Más fácil', 'badge-easy'],
    desc: 'Se abre directo en tu navegador. No necesitas instalar nada — solo una cuenta gratis de Canva.', download: false },
  { key: 'pptx', icon: '📊', label: 'Descargar en PowerPoint', badge: ['Más control', 'badge-pro'],
    desc: 'Descarga el archivo .pptx y edítalo con Microsoft PowerPoint, en tu computadora.', download: true },
  { key: 'docx', icon: '📝', label: 'Descargar en Word', badge: ['Más control', 'badge-pro'],
    desc: 'Descarga el archivo .docx y edítalo con Microsoft Word, en tu computadora.', download: true },
  { key: 'pdf', icon: '📄', label: 'Descargar tal cual (PDF)', badge: ['Sin editar', 'badge-static'],
    desc: 'Versión lista para imprimir directo, sin personalizar nada.', download: false }
];

const optionsEl = document.getElementById('optionsEl');
let count = 0;

OPTION_DEFS.forEach(def => {
  const url = params.get(def.key);
  if (!url) return;
  count++;
  const a = document.createElement('a');
  a.className = 'option';
  a.href = url;
  a.target = '_blank';
  if (def.download) a.setAttribute('download', '');
  a.innerHTML = `
    <div class="option-title">${def.icon} ${def.label}<span class="badge ${def.badge[1]}">${def.badge[0]}</span></div>
    <div class="option-desc">${def.desc}</div>
  `;
  optionsEl.appendChild(a);
});

if (count === 0) {
  optionsEl.innerHTML = '<p class="error-box">No encontramos las opciones de descarga para esta plantilla. Escríbenos a hola@dragonflaievents.com con tu correo de compra y te ayudamos directo.</p>';
} else if (count === 1) {
  document.getElementById('subEl').textContent = 'Da clic abajo para abrir tu plantilla.';
}
</script>

</body>
</html>
