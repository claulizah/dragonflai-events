<style>
:root{
  --teal:#2EC4B6; --teal-dark:#0D6E65; --teal-light:#EAF7F6;
  --violet:#7B2FBE; --violet-light:#F3EAFB;
  --night:#0D1B2A; --night-2:#152238;
  --text:#1A2332; --text-2:#4A5568; --text-3:#8A94A6;
  --white:#FFFFFF; --cream:#FAF9F7; --cream-2:#F5F3EF;
  --border-gray:#E5E1D8; --radius:14px; --radius-lg:22px;
  --shadow-md:0 8px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:linear-gradient(180deg,var(--page-wash-color,transparent) 0%,transparent 480px),var(--cream);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}
.wrap{max-width:820px;width:100%}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:2rem;opacity:.7}
.brand span{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;color:var(--text-2)}

/* ── TARJETA (mismos colores que el Save the Date de la app) ── */
.card{position:relative;overflow:hidden;border-radius:var(--radius-lg);padding:3rem 2rem;text-align:center;background:var(--cream);border:1px solid var(--border-gray);box-shadow:var(--shadow-md);margin-bottom:1.5rem;font-family:'Cormorant Garamond',serif}
.card.font-classic{font-family:'Playfair Display',serif}
.card.font-modern{font-family:'Montserrat',sans-serif}
.card.font-script{font-family:'Dancing Script',cursive}
.card.font-soft{font-family:'Libre Baskerville',serif}
.card.font-round{font-family:'Poppins',sans-serif}
.card.font-editorial{font-family:'Cinzel',serif}
.card.font-fun{font-family:'Fredoka',sans-serif}
.card.font-comic{font-family:'Comic Neue',cursive}
.card.font-playful{font-family:'Chewy',cursive}
.card.font-ziggy{font-family:'Ziggy Zoe',cursive}
.card.font-sketch{font-family:'Sketchbook',cursive}
.card.font-zhangqa{font-family:'Zhang QA',cursive}
.card.font-quasi{font-family:'Quasi',serif}
.card.font-pressboard{font-family:'Pressboard JL',serif}
.card.font-teenbold{font-family:'Teen Bold',sans-serif}
.card.font-alexbrush{font-family:'Alex Brush',cursive}
.card.font-caveat{font-family:'Caveat',cursive;font-weight:600}
/* Fondo con foto propia — con overlay claro para que el texto se lea */
.card.theme-custom-photo{background-size:cover!important;background-position:center!important;position:relative}
.card.theme-custom-photo::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.82);z-index:0;border-radius:inherit}
.card.theme-custom-photo>*{position:relative;z-index:1}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--custom-text-color,var(--teal-dark));margin-bottom:1rem;font-weight:600}
/* El título puede llevar una fuente distinta al resto (--title-font);
   si no se definió, hereda la del cuerpo — mismo comportamiento de siempre. */
.names{font-size:clamp(2.2rem,7.5vw,3.5rem);font-weight:600;line-height:1.15;margin-bottom:1rem;color:var(--custom-text-color,var(--text));font-family:var(--title-font,inherit)}
.card.font-script .names{font-weight:700}
.card.font-fun .names{font-weight:600}
.card.font-comic .names{font-weight:700}
.divider{width:60px;height:1px;background:var(--border-gray);margin:0 auto 1.2rem}
.details{display:flex;flex-direction:column;gap:8px;margin-bottom:1.2rem;font-size:16px;color:var(--text-2)}
.detail-item{display:flex;align-items:center;justify-content:center;gap:6px}
.msg{font-size:14.5px;color:var(--text-2);font-style:italic;margin-top:.5rem}
.hashtag{font-size:14.5px;color:var(--custom-text-color,var(--teal-dark));font-weight:700;margin-top:.6rem}
.countdown{display:flex;justify-content:center;gap:1.1rem;margin-top:1.5rem;flex-wrap:wrap}
.cd-unit{min-width:56px}
.cd-num{font-family:var(--title-font,'Cormorant Garamond',serif);font-size:1.9rem;font-weight:600;
        color:var(--custom-text-color,var(--teal-dark));line-height:1;font-variant-numeric:tabular-nums}
.cd-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin-top:3px}
.cd-sep{font-size:1.4rem;color:var(--text-3);opacity:.4;align-self:flex-start;line-height:1.3}
.cd-today{font-family:var(--title-font,'Cormorant Garamond',serif);font-size:1.5rem;
          color:var(--custom-text-color,var(--teal-dark));font-weight:600}

/* ── Contador público de confirmaciones ──
   Prueba social para el invitado, y empujón suave para el que no ha contestado. */
.rsvp-count{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:1.1rem;
            font-size:13px;color:var(--text-2)}
.rsvp-count .dotc{width:8px;height:8px;border-radius:50%;background:var(--teal);
                  box-shadow:0 0 0 4px rgba(46,196,182,.18)}
.rsvp-count b{color:var(--custom-text-color,var(--teal-dark));font-weight:700}
.rsvp-bar{height:5px;background:rgba(26,35,50,.08);border-radius:100px;overflow:hidden;margin-top:.55rem}
.rsvp-bar i{display:block;height:100%;border-radius:100px;
            background:linear-gradient(90deg,var(--teal),var(--violet));transition:width 1.1s ease}

/* ══════════════════════════════════════════════════════════════
   LEGIBILIDAD SOBRE FOTO
   Una foto clara vuelve el texto ilegible; una oscura se come el crema.
   El velo se calibra según el brillo real de la imagen, así que la
   anfitriona puede subir la foto que quiera sin arruinar la lectura.
   ══════════════════════════════════════════════════════════════ */
.card.theme-custom-photo::before{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background:var(--velo, linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.55) 45%, rgba(255,255,255,.78) 100%));
  transition:background .4s ease}
.card > *:not(.marco){position:relative;z-index:1}
.card.velo-oscuro{--velo:linear-gradient(180deg, rgba(14,20,28,.62) 0%, rgba(14,20,28,.44) 45%, rgba(14,20,28,.70) 100%)}
.card.velo-oscuro .detail-item,.card.velo-oscuro .msg,.card.velo-oscuro .cd-lbl,
.card.velo-oscuro .eyebrow,.card.velo-oscuro .rsvp-count{color:rgba(255,255,255,.90)!important}
.card.velo-oscuro .names,.card.velo-oscuro .cd-num,.card.velo-oscuro .monograma,
.card.velo-oscuro .hashtag,.card.velo-oscuro .cd-today{color:#fff!important}
.card.velo-oscuro .divider{background:rgba(255,255,255,.45)!important}
.card.velo-oscuro .rsvp-bar{background:rgba(255,255,255,.22)}

/* Parallax: la foto se mueve más lento que el scroll. Sutil a propósito
   — pasado de 0.3 marea en celular. */
.card.parallax{background-attachment:scroll}

/* ══════════════════════════════════════════════════════════════
   MARCO DECORATIVO POR TIPO DE EVENTO
   Las esquinas cambian según sea boda, XV, infantil o corporativo.
   Es lo que más se percibe como "hecho para mi evento".
   ══════════════════════════════════════════════════════════════ */
.marco{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.marco svg{position:absolute;width:96px;height:96px;opacity:.42;color:var(--custom-text-color,var(--teal-dark))}
.marco .e1{top:12px;left:12px}
.marco .e2{top:12px;right:12px;transform:scaleX(-1)}
.marco .e3{bottom:12px;left:12px;transform:scaleY(-1)}
.marco .e4{bottom:12px;right:12px;transform:scale(-1,-1)}
.card.velo-oscuro .marco svg{opacity:.55;color:rgba(255,255,255,.9)}
@media(max-width:420px){ .marco svg{width:66px;height:66px} }

/* ══════════════════════════════════════════════════════════════
   EL SOBRE
   Un link de WhatsApp se abre y se juzga en un segundo. El sobre
   convierte ese segundo en un gesto: hay que tocarlo para entrar.
   Además resuelve un problema técnico — iOS y Chrome bloquean el
   audio automático, pero SÍ lo permiten después de que la persona
   toca algo. El sobre es ese toque.
   ══════════════════════════════════════════════════════════════ */
#sobre{position:fixed;inset:0;z-index:400;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:1.6rem;cursor:pointer;
       background:var(--sobre-bg,linear-gradient(150deg,#FAF9F7 0%,#E9F6F4 45%,#EDE6F7 100%));
       transition:opacity .75s ease, visibility .75s}
#sobre.abierto{opacity:0;visibility:hidden;pointer-events:none}
.sobre-wrap{width:min(78vw,330px);perspective:1400px;transition:transform .8s cubic-bezier(.4,0,.2,1)}
#sobre.abierto .sobre-wrap{transform:scale(1.5) translateY(-14px)}
.sobre-svg{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 40px rgba(26,35,50,.22))}
/* La solapa gira sobre su borde superior — el gesto de abrir de verdad */
.solapa{transform-origin:50% 0%;transition:transform .85s cubic-bezier(.55,-0.3,.35,1.3)}
#sobre.abierto .solapa{transform:rotateX(-172deg)}
.sobre-hint{font-family:'Inter',sans-serif;font-size:13px;letter-spacing:.16em;
            text-transform:uppercase;color:var(--text-3);transition:opacity .3s}
#sobre.abierto .sobre-hint{opacity:0}
.sobre-nombres{font-family:var(--title-font,'Cormorant Garamond',serif);font-size:clamp(22px,5.6vw,30px);
               color:var(--teal-dark);text-align:center;padding:0 1.4rem;line-height:1.25}
@keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.sello{animation:latir 2.4s ease-in-out infinite;transform-origin:center}
#sobre.abierto .sello{animation:none;opacity:0;transition:opacity .35s}

/* Pétalos al abrir: caen una vez y se limpian solos */
#petalos{position:fixed;inset:0;z-index:399;pointer-events:none;overflow:hidden}
@keyframes caer{to{transform:translateY(108vh) rotate(var(--giro,420deg));opacity:0}}
.petalo{position:absolute;top:-8vh;will-change:transform;animation:caer linear forwards}

/* Monograma: las iniciales de los anfitriones, sin pedirle nada a nadie */
.monograma{display:flex;align-items:center;justify-content:center;gap:.55rem;
           font-family:var(--title-font,'Cormorant Garamond',serif);
           font-size:1.45rem;letter-spacing:.06em;color:var(--custom-text-color,var(--teal-dark));
           opacity:.85;margin-bottom:.7rem}
.monograma .mline{width:34px;height:1px;background:currentColor;opacity:.4}

/* ── Animación de entrada ──
   Un link de WhatsApp se juzga en el primer segundo. Esto es lo que
   pasa en ese segundo. Se apaga solo si el sistema pide menos movimiento. */
@keyframes dfSubir{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes dfEscala{from{opacity:0;transform:scale(.955)}to{opacity:1;transform:none}}
@keyframes dfAla{0%{opacity:0;transform:translateY(-14px) rotate(-8deg)}
                 60%{opacity:1;transform:translateY(3px) rotate(3deg)}
                 100%{opacity:1;transform:none}}
.anim .card{animation:dfEscala .85s cubic-bezier(.22,.68,.36,1) both}
.anim .card .names{animation:dfSubir .8s cubic-bezier(.22,.68,.36,1) .28s both}
.anim .card .event-label{animation:dfSubir .7s cubic-bezier(.22,.68,.36,1) .18s both}
.anim .card .details{animation:dfSubir .8s cubic-bezier(.22,.68,.36,1) .44s both}
.anim .card .countdown{animation:dfSubir .8s cubic-bezier(.22,.68,.36,1) .60s both}
.anim .card .rsvp-count{animation:dfSubir .8s cubic-bezier(.22,.68,.36,1) .72s both}
.anim .card .bug-fab,.anim .card .df-wing{animation:dfAla 1s cubic-bezier(.22,.68,.36,1) .5s both}
.reveal{opacity:0;transform:translateY(24px)}
.reveal.in{animation:dfSubir .7s cubic-bezier(.22,.68,.36,1) both}
@media (prefers-reduced-motion:reduce){
  .anim .card,.anim .card *,.reveal,.reveal.in{animation:none!important;opacity:1!important;transform:none!important}
}

/* ── RSVP ── */
.rsvp-card{background:var(--white);border-radius:var(--radius-lg);padding:2rem;box-shadow:var(--shadow-md)}

/* ── Secciones extra: historia, itinerario, hospedaje, galería, regalos, FAQ ── */
.extra-card{background:var(--white);border-radius:var(--radius-lg);padding:1.75rem;box-shadow:var(--shadow-md);margin-bottom:1.25rem}
.extra-title{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;color:var(--text);margin-bottom:1rem;text-align:center}
.extra-story{font-size:15.5px;line-height:1.7;color:var(--text-2);text-align:center}
.schedule-item{padding:12px 0;border-top:1px solid var(--border-gray)}
.schedule-item:first-of-type{border-top:none}
.schedule-name{font-weight:600;font-size:16px;color:var(--text);margin-bottom:3px}
.schedule-meta{font-size:14px;color:var(--text-2);margin-bottom:2px}
.schedule-desc{font-size:12.5px;color:var(--text-3);font-style:italic;margin-top:4px}
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gallery-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.extra-links-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.extra-link-btn{display:inline-block;padding:10px 18px;border-radius:100px;background:var(--teal-light);color:var(--teal-dark);font-size:14.5px;font-weight:600;text-decoration:none;transition:all .2s}
.extra-link-btn:hover{background:var(--teal);color:#fff}
.faq-item{padding:10px 0;border-top:1px solid var(--border-gray)}
.faq-item:first-of-type{border-top:none}
.faq-q{font-weight:600;font-size:15px;color:var(--text);margin-bottom:3px}
.faq-a{font-size:14.5px;color:var(--text-2);line-height:1.5}
.rsvp-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;text-align:center;margin-bottom:1.5rem}
.rsvp-trigger-btn{display:block;width:100%;background:var(--white);color:var(--custom-text-color,var(--teal-dark));border:1.5px solid var(--custom-text-color,var(--teal-dark));border-radius:100px;padding:14px;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;margin-bottom:1.5rem;box-shadow:var(--shadow-md)}
.field{margin-bottom:1rem}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:.4rem}
.field input[type=text],.field input[type=number],.field textarea{width:100%;padding:11px;border-radius:var(--radius);border:1.5px solid var(--border-gray);font-family:'Inter',sans-serif;font-size:14px;background:var(--cream-2)}
.field textarea{resize:vertical;min-height:70px}
.attend-toggle{display:flex;gap:10px}
.attend-opt{flex:1;padding:14px;border-radius:var(--radius);border:1.5px solid var(--border-gray);text-align:center;cursor:pointer;font-weight:600;font-size:14px;transition:all .15s;background:var(--cream-2);color:var(--text-2)}
.attend-opt.sel-yes{background:var(--teal);border-color:var(--teal);color:#fff}
.attend-opt.sel-no{background:#E8637A;border-color:#E8637A;color:#fff}
.btn-submit{width:100%;padding:14px;border-radius:100px;border:none;background:linear-gradient(135deg,var(--teal),var(--violet));color:#fff;font-weight:600;font-size:15px;cursor:pointer;font-family:'Inter',sans-serif;margin-top:.5rem}
.btn-submit:disabled{opacity:.5;cursor:not-allowed}
.state-msg{text-align:center;padding:3rem 1rem;color:var(--text-2)}
.state-msg h2{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--text);margin-bottom:.5rem}
.thanks-card{text-align:center;padding:3rem 2rem;background:linear-gradient(135deg,var(--teal-light),var(--violet-light));border-radius:var(--radius-lg);box-shadow:var(--shadow-md);cursor:default}
.thanks-emoji{font-size:52px;margin-bottom:.5rem}
.thanks-card h2{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;color:var(--text);margin-bottom:.6rem}
.thanks-card p{font-size:15px;color:var(--text-2)}
.thanks-brand{margin-top:1.5rem;font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:600;color:var(--teal-dark);letter-spacing:.03em}
.planner-watermark{margin-top:1.2rem;margin-bottom:1rem;font-size:10px;color:var(--text-3);letter-spacing:.03em;opacity:.6;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--night);color:#fff;padding:12px 20px;border-radius:100px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .25s;z-index:100}
.toast.show{opacity:1}
.lang-toggle{display:flex;justify-content:center;gap:6px;margin-bottom:1rem}
.lang-btn{padding:4px 12px;border-radius:100px;border:1px solid var(--border-gray);background:var(--white);color:var(--text-2);font-size:11px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s}
.lang-btn.active{background:var(--teal-light);border-color:var(--teal);color:var(--teal-dark);font-weight:600}
.guest-match{padding:10px 12px;border:1.5px solid var(--border-gray);border-radius:var(--radius);margin-top:6px;cursor:pointer;font-size:13.5px;transition:all .15s}
.guest-match:hover{border-color:var(--teal);background:var(--teal-light)}
.group-member-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid rgba(0,0,0,.06);font-size:13.5px}
.group-member-row:first-of-type{border-top:none}
.group-member-done{font-size:11px;color:var(--text-3);font-weight:400}
.attend-toggle-mini{display:flex;gap:6px}
.mini-btn{padding:5px 12px;border-radius:100px;border:1.5px solid var(--border-gray);background:var(--white);font-size:12px;font-weight:600;cursor:pointer;color:var(--text-2);font-family:'Inter',sans-serif}
.mini-sel-yes{background:var(--teal);border-color:var(--teal);color:#fff}
.mini-sel-no{background:#E8637A;border-color:#E8637A;color:#fff}
</style>
</head>

    <svg width="20" height="20" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="18" cy="20" rx="2.2" ry="8" fill="#2EC4B6"/><ellipse cx="18" cy="13" rx="2.8" ry="2.8" fill="#2EC4B6"/><ellipse cx="10" cy="14" rx="8" ry="4" fill="#7B2FBE" opacity=".5" transform="rotate(-20 10 14)"/><ellipse cx="26" cy="14" rx="8" ry="4" fill="#7B2FBE" opacity=".5" transform="rotate(20 26 14)"/></svg>
    <span>DragonflAI Events</span>
  </div>

    <button class="lang-btn active" onclick="setLang('es')" id="btn-es">ES</button>

    <button class="lang-btn" onclick="setLang('fr')" id="btn-fr">FR</button>

  </p>
</div>

async function anonInsertRsvps(payloads){
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/rsvps`,{
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(payloads)
    });
    if(!res.ok){
      let error; try{ error=await res.json(); }catch(e){ error={message:res.statusText,status:res.status}; }
      return {error};
    }
    return {error:null};
  }catch(err){ return {error:{message:String(err)}}; }
}
async function anonUpdateMyRsvp(params){
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/rpc/update_my_rsvp`,{
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json'},
      body:JSON.stringify(params)
    });
    if(!res.ok){
      let error; try{ error=await res.json(); }catch(e){ error={message:res.statusText,status:res.status}; }
      return {data:null,error};
    }
    const data=await res.json();
    return {data,error:null};
  }catch(err){ return {data:null,error:{message:String(err)}}; }
}

// ══════════════════════════════
//  LOG DE ERRORES EN PRODUCCIÓN
//  Captura los errores de JavaScript que truenan en el navegador del
//  usuario y los guarda en Supabase (tabla error_log) — sin esto, solo
//  nos enteramos de los bugs si alguien se toma la molestia de reportarlos.
//  Protecciones: máx 10 errores por sesión, sin duplicados, textos
//  recortados, y jamás deja que el propio logger truene la app.
// ══════════════════════════════
(function(){
  let reported=0; const seen=new Set();
  function logJsError(message,source,line,col,stack){
    try{
      if(typeof sb==='undefined'||!sb||reported>=10) return;
      const key=String(message||'').slice(0,120);
      if(!key||seen.has(key)) return;
      seen.add(key); reported++;
      let uid=null; try{ uid=(typeof currentUser!=='undefined'&&currentUser)?currentUser.id:null; }catch(_){}
      sb.from('error_log').insert({
        page:location.pathname+location.search.slice(0,80),
        message:String(message||'').slice(0,1000),
        source:String(source||'').slice(0,300),
        line:Number.isFinite(line)?line:null,
        col:Number.isFinite(col)?col:null,
        stack:String(stack||'').slice(0,2000),
        user_agent:navigator.userAgent.slice(0,300),
        user_id:uid
      }).then(()=>{},()=>{});
    }catch(_){/* el logger nunca debe romper la app */}
  }
  window.addEventListener('error',e=>logJsError(e.message,e.filename,e.lineno,e.colno,e.error&&e.error.stack));
  window.addEventListener('unhandledrejection',e=>{
    const r=e&&e.reason||{};
    logJsError(r.message||String(e&&e.reason||'unhandled rejection'),'unhandledrejection',null,null,r.stack);
  });
})();

// Identifica este dispositivo (no una cuenta) para saber qué fotos subió
// — así el botón de borrar solo aparece en las tuyas, sin necesitar login.
function getUploaderToken(){
  let tok=localStorage.getItem('dflai_uploader_token');
  if(!tok){
    tok=(crypto.randomUUID&&crypto.randomUUID())||(Date.now()+'-'+Math.random().toString(36).slice(2));
    localStorage.setItem('dflai_uploader_token',tok);
  }
  return tok;
}
// ══════════════════════════════════════════════════════════════
//  RESOLUCIÓN DE IDIOMA — misma lógica que la landing y la app.
//  Prioridad: ?lang= en la URL → localStorage → navegador → es
//  NOTA DE PRODUCTO: hoy el idioma de esta página lo decide el INVITADO
//  (su navegador o su preferencia guardada), no el anfitrión. Para que la
//  invitación herede el idioma de quien la creó haría falta guardar el
//  idioma en la tabla `invitations` al publicar y leerlo aquí — pendiente,
//  documentado aparte.
// ══════════════════════════════════════════════════════════════
const DFLAI_LANG_KEY='dflai_lang';
let dflaiLangForcedByUrl=false;
function dflaiRememberLang(l){ try{ localStorage.setItem(DFLAI_LANG_KEY,l); }catch(e){} }
function dflaiResolveLang(){
  let q='';
  try{ q=(new URLSearchParams(location.search).get('lang')||'').toLowerCase().slice(0,2); }catch(e){}
  if(q==='es'||q==='en'||q==='fr'){ dflaiLangForcedByUrl=true; dflaiRememberLang(q); return q; }
  try{ const st=localStorage.getItem(DFLAI_LANG_KEY); if(st==='es'||st==='en'||st==='fr') return st; }catch(e){}
  // Detección por navegador: apagada para es/en (ver nota abajo), pero
  // ENCENDIDA para francés. Esta página es de solo lectura + un formulario
  // de RSVP -- no hay generación de IA ni correos del worker de por medio,
  // así que detectar francés aquí no arriesga nada del embudo de venta.
  // Es justo lo que resuelve el caso real: invitados en México, Inglaterra
  // y Francia abriendo el MISMO link, cada quien viendo su idioma solo.
  const DFLAI_AUTODETECT_FR = true;
  if(DFLAI_AUTODETECT_FR){
    const cands=[navigator.language].concat(navigator.languages||[]);
    for(const c of cands){
      if(!c) continue;
      if(String(c).toLowerCase().indexOf('fr')===0) return 'fr';
    }
  }
  // Detección por navegador para es/en: APAGADA a propósito.
  // El público real es hispanohablante, pero muchos traen el teléfono
  // configurado en inglés — y el embudo en inglés (plan generado y
  // correos del worker) todavía no está validado. Mandarlos a inglés
  // los deja a medio camino. Se reactiva poniendo esto en true, cuando
  // la generación y los correos en inglés estén confirmados.
  const DFLAI_AUTODETECT = false;
  if(DFLAI_AUTODETECT){
    const cands=[navigator.language].concat(navigator.languages||[]);
    for(const c of cands){
      if(!c) continue;
      const b=String(c).toLowerCase();
      if(b.indexOf('es')===0) return 'es';
      if(b.indexOf('en')===0) return 'en';
    }
  }
  return 'es';
}

function setLang(l){
  lang=l;
  dflaiRememberLang(l);
  document.getElementById('btn-es').className='lang-btn'+(l==='es'?' active':'');
  document.getElementById('btn-en').className='lang-btn'+(l==='en'?' active':'');
  document.getElementById('btn-fr').className='lang-btn'+(l==='fr'?' active':'');
  document.documentElement.lang=l;
  const loadingText=document.getElementById('loading-text');
  if(loadingText) loadingText.textContent=T[lang].loading;
  document.getElementById('footer-terms').textContent=T[lang].footerTerms;
  document.getElementById('footer-privacy').textContent=T[lang].footerPrivacy;
  // Estos cuatro se quedan en es/en -- son el modal de "reportar un
  // problema", que usan tú y quien pruebe, no un invitado en Francia.
  // Si algún día importa, es una traducción de cuatro líneas más.
  document.getElementById('bug-modal-title').textContent=lang==='es'?'🐞 Reportar un problema':'🐞 Report a problem';
  document.getElementById('bug-modal-text').textContent=lang==='es'?'Cuéntanos qué pasó — entre más detalle, más fácil lo encontramos.':'Tell us what happened — the more detail, the easier it is for us to find it.';
  document.getElementById('bug-modal-send').textContent=lang==='es'?'Enviar reporte':'Send report';
  document.getElementById('bug-modal-cancel').textContent=lang==='es'?'Cancelar':'Cancel';
  document.title=L3('Invitación','Invitation','Invitation')+' — DragonflAI Events';
  // Repintar lo que sea que esté en pantalla, no solo la invitación.
  if(cdTimer && invitation) pintarCuenta();
  if(currentView==='notfound') renderNotFound();
  else if(invitation) renderInvitation(invitation);
  else if(currentView==='loading' && document.getElementById('loading-text')) document.getElementById('loading-text').textContent=T[lang].loading;
}

function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toTitleCase(s){
  const t=String(s??'');
  // Si ya viene capitalizado a propósito lo dejamos en paz: normalizar a
  // ciegas rompía "JC & Ana" -> "Jc & Ana" y "María de la Cruz" ->
  // "María De La Cruz", y esto va en la línea más visible de la invitación.
  // Solo arreglamos cuando la persona escribió TODO IGUAL (mayúsculas o
  // minúsculas), que es cuando de verdad no eligió formato.
  if(t!==t.toUpperCase() && t!==t.toLowerCase()) return t;
  return t.toLowerCase().replace(/(^|\s|&|-)\S/g,c=>c.toUpperCase());
}

// ── Agregar a mi calendario ──
// La hora se guarda como texto de exhibición ("6:00 PM – 11:00 PM"), no en
// formato de máquina — se extrae con regex; si no se puede leer, cae a un
// bloque razonable de 6pm-11pm en vez de fallar.
function parseEventTimeRange(eventTime){
  if(!eventTime) return null;
  const matches=[...String(eventTime).matchAll(/(\d{1,2}):(\d{2})\s*(AM|PM)/gi)];
  if(!matches.length) return null;
  const to24=(h,m,ap)=>{
    h=parseInt(h,10); m=parseInt(m,10);
    const isPM=/pm/i.test(ap);
    if(isPM&&h!==12) h+=12;
    if(!isPM&&h===12) h=0;
    return {h,m};
  };
  return {start:to24(matches[0][1],matches[0][2],matches[0][3]), end:matches[1]?to24(matches[1][1],matches[1][2],matches[1][3]):null};
}

function getEventDatesForCalendar(){
  const dateRaw=invitation?.event_date_raw;
  if(!dateRaw) return null;
  const parsed=parseEventTimeRange(invitation.event_time);
  const startDate=new Date(dateRaw+'T00:00:00');
  startDate.setHours(parsed?parsed.start.h:18, parsed?parsed.start.m:0, 0, 0);
  const endDate=new Date(dateRaw+'T00:00:00');
  if(parsed&&parsed.end) endDate.setHours(parsed.end.h, parsed.end.m, 0, 0);
  else endDate.setHours(23, 0, 0, 0);
  if(endDate<=startDate) endDate.setDate(endDate.getDate()+1); // cruza medianoche
  return {startDate,endDate};
}

function fmtICSDate(d){
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`;
}

function icsEscape(s){
  return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}

  const location=encodeURIComponent(invitation.location||'');

  const url=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${datesParam}&details=${details}&location=${location}&ctz=America/Mexico_City`;

function downloadIcsFile(){
  const dates=getEventDatesForCalendar();
  if(!dates||!invitation){ showToast(L3('No se pudo generar el evento','Could not generate the event','Impossible de générer l\u2019événement')); return; }
  const uid=`${invitation.slug||'evento'}-${Date.now()}@dragonflaievents.com`;
  const ics=[
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//DragonflAI Events//ES','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTAMP:${fmtICSDate(new Date())}`,
    `DTSTART:${fmtICSDate(dates.startDate)}`,
    `DTEND:${fmtICSDate(dates.endDate)}`,
    `SUMMARY:${icsEscape(invitation.host_names||L3('Evento','Event','Événement'))}`,
    invitation.location?`LOCATION:${icsEscape(invitation.location)}`:'',
    `DESCRIPTION:${icsEscape(L3(`Invitación de ${invitation.host_names||''}`,`Invitation from ${invitation.host_names||''}`,`Invitation de ${invitation.host_names||''}`))}`,
    'END:VEVENT','END:VCALENDAR'
  ].filter(Boolean).join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`${invitation.slug||'evento'}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);

}

// ── Compartir ──
// navigator.share() abre el share sheet nativo del sistema — en iOS y
// Android eso trae WhatsApp, Mensajes, Correo, etc. ya instalados, sin
// que el invitado tenga que copiar y pegar nada. Es soportado en Safari
// iOS y Chrome Android desde hace años, pero NO en desktop Chrome/Firefox
// — de ahí el respaldo a portapapeles, que sí funciona en todos lados.
async function compartirInvitacion(){
  const tt=T[lang];
  const url=location.href;
  const titulo=(invitation && toTitleCase(invitation.host_names))
    ? `${toTitleCase(invitation.host_names)} — ${tt.invitedFallback}`
    : document.title;

  if(navigator.share){
    try{
      await navigator.share({title:titulo, text:tt.invitedFallback, url});
      return;   // el share sheet ya hizo su trabajo; nada más que avisar
    }catch(e){
      // AbortError = el invitado cerró el share sheet sin elegir nada.
      // No es un error real, así que no se le muestra nada.
      if(e && e.name==='AbortError') return;
      // Cualquier otro fallo cae al respaldo de copiar.
    }
  }

  try{
    await navigator.clipboard.writeText(url);
    showToast(tt.shareLinkCopied);
  }catch(e){
    // Último recorrido: seleccionar el texto manualmente. Pasa sobre todo
    // en navegadores viejos o páginas sin HTTPS, donde el portapapeles
    // moderno está bloqueado.
    const ta=document.createElement('textarea');
    ta.value=url; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); showToast(tt.shareLinkCopied); }catch(e2){}
    ta.remove();
  }
}

function getSlug(){
  // Soporta: /nombre-evento (dominio propio, link corto), /i/nombre-evento
  // (compatibilidad con links viejos ya compartidos), y ?slug=nombre-evento (respaldo)
  const path=location.pathname.replace(/\/+$/,'');
  const parts=path.split('/').filter(Boolean);
  const idxI=parts.indexOf('i');
  if(idxI!==-1 && parts[idxI+1]) return decodeURIComponent(parts[idxI+1]);
  const knownPages=['index.html','terminos.html','aviso-de-privacidad.html','dragonflai-v2.html','invitacion.html','invitation-og.js','worker.js','app'];
  if(parts.length===1 && !knownPages.includes(parts[0])) return decodeURIComponent(parts[0]);
  const qs=new URLSearchParams(location.search);
  return qs.get('slug')||qs.get('i')||'';
}

// ══════════════════════════════════════════════════════════════
//  Familia de evento
//  event_type llega con texto libre ("Boda/Wedding", "XV de Regina",
//  "Fiesta Infantil"). Se normaliza a una familia para elegir marco
//  y sobre.
// ══════════════════════════════════════════════════════════════
function familiaEvento(tipo){
  const t=String(tipo||'').toLowerCase();
  if(/boda|wedding|aniversario|anniversary/.test(t)) return 'boda';
  if(/xv|quince|sweet\s*16/.test(t)) return 'xv';
  // Fiesta infantil = juguetona (globos, confeti). Cumpleaños a secas, sin
  // señal de "niños", se trata como celebración de adulto: sobria, no
  // infantil — un cumpleaños de 40 años no debería llegar con globos.
  if(/infantil|kids|ni[ñn]o|baby|bautizo|christening|comuni[oó]n/.test(t)) return 'infantil';
  if(/cumplea|birthday/.test(t)) return 'cumpleanos';
  if(/corporat|empresa|business|graduaci|graduation/.test(t)) return 'formal';
  return 'formal';   // ante un tipo desconocido, geometría neutra: nunca desentona
}

// ══════════════════════════════════════════════════════════════
//  Velo de legibilidad
//  Mide el brillo real de la foto en un canvas pequeño y decide si el
//  texto va oscuro sobre velo claro, o blanco sobre velo oscuro.
//  Si el navegador bloquea la lectura del canvas (CORS), se queda con
//  el velo claro por defecto — que nunca deja el texto ilegible.
// ══════════════════════════════════════════════════════════════
function calibrarVelo(url, card){
  if(!url || !card) return;
  const img=new Image();
  img.crossOrigin='anonymous';
  img.onload=()=>{
    try{
      const n=24, cv=document.createElement('canvas');
      cv.width=n; cv.height=n;
      const ctx=cv.getContext('2d',{willReadFrequently:true});
      ctx.drawImage(img,0,0,n,n);
      const px=ctx.getImageData(0,0,n,n).data;
      let suma=0, cuenta=0;
      for(let i=0;i<px.length;i+=4){
        // Luminancia percibida: el ojo no pesa igual los tres canales
        suma+=0.2126*px[i]+0.7152*px[i+1]+0.0722*px[i+2];
        cuenta++;
      }
      const brillo=suma/cuenta;
      // Foto oscura → texto blanco. Foto clara → velo claro y texto normal.
      if(brillo<118) card.classList.add('velo-oscuro');
    }catch(e){ /* CORS: se queda el velo claro, que siempre es legible */ }
  };
  img.onerror=()=>{};
  img.src=url;
}

// ══════════════════════════════════════════════════════════════
//  Parallax de la foto de fondo
//  0.28 es deliberado: más que eso marea en celular.
// ══════════════════════════════════════════════════════════════
let plxRaf=null;
function activarParallax(card){
  if(!card || !card.classList.contains('theme-custom-photo')) return;
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  card.classList.add('parallax');
  const mover=()=>{
    plxRaf=null;
    const r=card.getBoundingClientRect();
    if(r.bottom<0 || r.top>window.innerHeight) return;
    card.style.backgroundPosition='center calc(50% + '+(r.top*-0.28).toFixed(1)+'px)';
  };
  const onScroll=()=>{ if(!plxRaf) plxRaf=requestAnimationFrame(mover); };
  window.addEventListener('scroll',onScroll,{passive:true});
  mover();
}

// ══════════════════════════════════════════════════════════════
//  Monograma — iniciales de los anfitriones
//  Se deduce del nombre; no le pide nada extra a la anfitriona.
//  "Ana & Diego" → A · D   ·   "Sofía" → S
// ══════════════════════════════════════════════════════════════
function iniciales(nombres){
  let txt=String(nombres||'').trim();
  if(!txt) return '';
  // "XV de Regina" o "Boda de Ana y Luis" traen el tipo de evento pegado.
  // El monograma es de las personas, no del tipo de fiesta.
  txt=txt.replace(/^(mis\s+)?(xv|quince(añera)?s?|boda|bautizo|fiesta|cumplea(ñ|n)os|graduaci(ó|o)n|baby\s*shower|primera\s+comuni(ó|o)n)(\s+a(ñ|n)os)?\s*(de\s+|:)\s*/i,'').trim();
  if(!txt) return '';
  // Partir por separadores de pareja, no por cualquier espacio:
  // "Ana María & Diego" son dos personas, no tres.
  const partes=txt.split(/\s*(?:&|\+|\by\b|\band\b)\s*/i).filter(Boolean);
  const ini=partes.map(p=>{
    const w=p.trim().split(/\s+/)[0]||'';
    return w.charAt(0).toUpperCase();
  }).filter(c=>/[A-ZÁÉÍÓÚÑÜ]/.test(c));
  return ini.slice(0,3).join(' · ');
}

function renderMonograma(inv){
  const ini=iniciales(inv && inv.host_names);
  if(!ini) return '';
  return `<div class="monograma"><span class="mline"></span><span>${esc(ini)}</span><span class="mline"></span></div>`;
}

//  Dos siluetas de sobre, mismo papel y mismos colores por familia —

//  cambiar de estilo nunca desentone con el resto de la invitación.

         el color saturado del cuerpo hacía de borde solo. -->

}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const d=new Date(dateStr);
  if(isNaN(d)) return null;
  const diff=Math.ceil((d-new Date())/(1000*60*60*24));
  return diff>=0?diff:null;
}

// ══════════════════════════════════════════════════════════════
//  Cuenta regresiva viva
//  Antes solo mostraba los días. Un número que se mueve solo es lo que
//  hace que la invitación se sienta viva en lugar de una imagen.
// ══════════════════════════════════════════════════════════════
let cdTimer=null;

// Construye la fecha objetivo en hora local. Si event_time trae una hora
// (ej. "18:00", "6:00 pm", "18:00 - 23:00"), la usa; si no, medianoche.
function fechaObjetivo(inv){
  if(!inv || !inv.event_date_raw) return null;
  const base=new Date(inv.event_date_raw);
  if(isNaN(base)) return null;
  let hh=0, mm=0;
  const txt=String(inv.event_time||'');
  const m=txt.match(/(\d{1,2})\s*[:.]?\s*(\d{2})?\s*(a\.?m\.?|p\.?m\.?|am|pm)?/i);
  if(m){
    hh=parseInt(m[1],10)||0;
    mm=m[2]?parseInt(m[2],10):0;
    const suf=(m[3]||'').toLowerCase().replace(/\./g,'');
    if(suf==='pm' && hh<12) hh+=12;
    if(suf==='am' && hh===12) hh=0;
    if(hh>23) hh=0;
    if(mm>59) mm=0;
  }
  // event_date_raw viene como YYYY-MM-DD; se arma en local para no
  // recorrer un día por la zona horaria del invitado.
  const partes=String(inv.event_date_raw).slice(0,10).split('-').map(Number);
  if(partes.length===3 && !partes.some(isNaN)){
    return new Date(partes[0], partes[1]-1, partes[2], hh, mm, 0, 0);
  }
  base.setHours(hh,mm,0,0);
  return base;
}

function pintarCuenta(){
  const cont=document.getElementById('countdown');
  if(!cont || !invitation) return;
  const objetivo=fechaObjetivo(invitation);
  if(!objetivo){ cont.innerHTML=''; return; }
  const t=T[lang];
  let ms=objetivo-new Date();

  if(ms<=0){
    // El día del evento, y hasta 12 h después, celebra en vez de mostrar ceros
    cont.innerHTML = ms > -12*3600*1000
      ? `<div class="cd-today">${L3('¡Hoy es el día! 🎉','Today is the day! 🎉','C\u2019est le grand jour ! 🎉')}</div>`
      : '';
    if(cdTimer){ clearInterval(cdTimer); cdTimer=null; }
    return;
  }

  const seg=Math.floor(ms/1000);
  const d=Math.floor(seg/86400), h=Math.floor(seg%86400/3600),
        mi=Math.floor(seg%3600/60), sg=seg%60;
  const L = lang==='fr'
    ? ['jours','h','min','sec']
    : lang==='es'
    ? ['días','horas','min','seg']
    : ['days','hours','min','sec'];
  const u=(n,l)=>`<div class="cd-unit"><div class="cd-num">${String(n).padStart(2,'0')}</div><div class="cd-lbl">${l}</div></div>`;
  cont.innerHTML = u(d,L[0])+'<span class="cd-sep">:</span>'+u(h,L[1])
                 + '<span class="cd-sep">:</span>'+u(mi,L[2])
                 + '<span class="cd-sep">:</span>'+u(sg,L[3]);
}

function arrancarCuenta(){
  if(cdTimer) clearInterval(cdTimer);
  pintarCuenta();
  cdTimer=setInterval(pintarCuenta,1000);
}

// ══════════════════════════════════════════════════════════════
//  Contador público de confirmaciones
//  Requiere la función SQL get_rsvp_public_count (ver migración).
//  Si todavía no existe en producción, esto no rompe nada: simplemente
//  no pinta el contador.
// ══════════════════════════════════════════════════════════════
async function pintarConfirmaciones(inv){
  const cont=document.getElementById('rsvp-count');
  if(!cont || !inv) return;
  try{
    const {data,error}=await sb.rpc('get_rsvp_public_count',{p_invitation_id:inv.id});
    if(error || !data) return;
    const r=Array.isArray(data)?data[0]:data;
    const si=Number(r?.attending_count||0), tot=Number(r?.total_guests||0);
    if(si<1) return;   // con 0 o 1 confirmación el dato juega en contra
    const txt = lang==='fr'
      ? `<b>${si}</b> ${si===1?'personne a confirmé':'personnes ont confirmé'}`
      : lang==='es'
      ? `<b>${si}</b> ${si===1?'persona ya confirmó':'personas ya confirmaron'}`
      : `<b>${si}</b> ${si===1?'guest has confirmed':'guests have confirmed'}`;
    const pct = tot>0 ? Math.min(100, Math.round(si/tot*100)) : 0;
    cont.innerHTML=`<span class="dotc"></span><span>${txt}</span>`
      + (tot>0?`<div class="rsvp-bar" style="width:100%"><i style="width:0%"></i></div>`:'');
    if(tot>0) requestAnimationFrame(()=>{
      const b=cont.querySelector('.rsvp-bar i'); if(b) b.style.width=pct+'%';
    });
  }catch(e){ /* sin contador, la invitación funciona igual */ }
}

// ══════════════════════════════════════════════════════════════
//  Revelado progresivo de las secciones de abajo
// ══════════════════════════════════════════════════════════════
function activarRevelado(){
  const els=document.querySelectorAll('.reveal');
  if(!els.length) return;
  if(!('IntersectionObserver' in window)){
    els.forEach(e=>e.classList.add('in')); return;
  }
  const io=new IntersectionObserver((ent,obs)=>{
    ent.forEach((e,i)=>{
      if(!e.isIntersecting) return;
      e.target.style.animationDelay=(i*0.08)+'s';
      e.target.classList.add('in');
      obs.unobserve(e.target);
    });
  },{threshold:0.12, rootMargin:'0px 0px -40px 0px'});
  els.forEach(e=>io.observe(e));
}

function extractRepresentativeColor(bgValue){
  // Si es un degradado, toma el primer color que aparezca en la definición
  const match=bgValue.match(/#[0-9a-fA-F]{3,8}/);
  return match?match[0]:'#FAF9F7';
}

function hexToRgba(hex,alpha){
  hex=hex.replace('#','');
  if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  const r=parseInt(hex.substring(0,2),16);
  const g=parseInt(hex.substring(2,4),16);
  const b=parseInt(hex.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

        <div id="rsvp-rest" ${restricted?'style="display:none"':''}>

            <textarea id="r-message" placeholder="${t.messagePh}"></textarea>

     nunca tocaba ¿Asistes?, el botón se quedaba deshabilitado y el clic no
     hacía absolutamente nada -- ni el aviso de "elige si asistes" llegaba a
     mostrarse, porque un botón disabled no dispara el submit del form.
     Ahora el botón siempre puede presionarse, y submitRSVP() es quien
     valida nombre y asistencia con un mensaje claro en cada caso. -->
<button type="submit" class="btn-submit" id="btn-submit">${t.confirmBtn}</button>
        </div>
      </form>
      </div>
     </div>

  document.getElementById('rsvp-form').addEventListener('submit',submitRSVP);
  if(restricted && selectedGuest) showSelectedGuest(selectedGuest);
  if(attending!==null) setAttending(attending);
  if(lodgingNeeded!==null && document.getElementById('opt-lodging-yes')) setLodging(lodgingNeeded);

  // Todo lo que se mueve se enciende aquí, al final: la tarjeta ya existe
  // en el DOM y las animaciones no arrancan sobre elementos a medio pintar.
  activarDinamicos(inv);
}

function openRsvpModal(){
  const overlay=document.getElementById('rsvp-modal-overlay');
  if(overlay) overlay.style.display='flex';
  document.body.style.overflow='hidden';
}

function closeRsvpModal(){
  const overlay=document.getElementById('rsvp-modal-overlay');
  if(overlay) overlay.style.display='none';
  document.body.style.overflow='';
}

async function onGuestSearchInput(){
  const q=document.getElementById('r-name-search').value.trim();
  const resultsEl=document.getElementById('guest-search-results');
  clearTimeout(guestSearchTimer);
  if(q.length<2){ resultsEl.innerHTML=''; return; }
  guestSearchTimer=setTimeout(async()=>{
    const {data,error}=await sb.rpc('search_guest_list',{p_invitation_id:invitation.id,p_query:q});
    if(error||!data||!data.length){
      resultsEl.innerHTML=`<div style="background:var(--cream-2);border:1.5px solid var(--border-gray);border-radius:var(--radius);padding:12px 14px;margin-top:.6rem;font-size:13.5px;color:var(--text-2);line-height:1.5">${T[lang].searchNoResults}</div>`;
      return;
    }
    lastSearchResults=data;
    resultsEl.innerHTML=data.map((g,i)=>`<div class="guest-match" onclick="selectGuestMatch(${i})">${esc(g.guest_name)}</div>`).join('');
  },350);
}

let groupMembers=null; // null = modo individual normal; array = modo grupo activo

async function selectGuestMatch(i){
  const g=lastSearchResults[i];
  const {data,error}=await sb.rpc('get_guest_group',{p_guest_id:g.id});

  if(error||!data||!data.length){
    // Si algo falla, no dejamos a la persona atorada — la tratamos como individual
    selectedGuest=g;
    groupMembers=null;
    showSelectedGuest(g);
    return;
  }

  if(data.length<=1){
    selectedGuest=data[0]||g;
    groupMembers=null;
    showSelectedGuest(selectedGuest);
  } else {
    groupMembers=data.map(m=>({...m,attending:null}));
    selectedGuest=null;
    showGuestGroup();
  }
}

let editingGuestListId=null;
let lastSelectedGuest=null;

function showSelectedGuest(g){
  const t=T[lang];
  lastSelectedGuest=g;
  editingGuestListId=null;
  document.getElementById('field-name-search').style.display='none';
  document.getElementById('field-name-selected').style.display='block';
  document.getElementById('field-attending-single').style.display='block';
  const editBtn=document.getElementById('btn-edit-rsvp');

  if(g.already_responded){
    document.getElementById('selected-guest-display').innerHTML=`${esc(g.guest_name)}<br><span style="font-weight:400;font-size:12px">${t.alreadyResponded}</span><br><span style="font-weight:400;font-size:12px">${t.yourResponseWas} <strong>${g.prev_attending?t.respondingYes:t.respondingNo}</strong></span>`;
    document.getElementById('rsvp-rest').style.display='none';
    if(editBtn){ editBtn.textContent=t.editMyResponse; editBtn.style.display='block'; }
    return;
  }

  if(editBtn) editBtn.style.display='none';
  document.getElementById('selected-guest-display').textContent=`${t.searchAreYouThisPerson} ${g.guest_name}`;
  document.getElementById('rsvp-rest').style.display='block';

  const guestsField=document.getElementById('r-guests');
  if(guestsField){
    guestsField.max=g.max_companions;
    const note=document.getElementById('max-companions-note');
    if(note) note.textContent=t.maxCompanionsNote.replace('{n}',g.max_companions);
  }
}

function startEditingRSVP(){
  if(!lastSelectedGuest) return;
  const g=lastSelectedGuest;
  editingGuestListId=g.id;

  document.getElementById('rsvp-rest').style.display='block';
  document.getElementById('btn-edit-rsvp').style.display='none';

  setAttending(g.prev_attending);
  const emailEl=document.getElementById('r-email'); if(emailEl) emailEl.value=g.prev_email||'';
  const guestsEl=document.getElementById('r-guests'); if(guestsEl) guestsEl.value=g.prev_guest_count||0;
  const dietaryEl=document.getElementById('r-dietary'); if(dietaryEl) dietaryEl.value=g.prev_dietary||'';
  const songEl=document.getElementById('r-song'); if(songEl) songEl.value=g.prev_song_request||'';
  if(g.prev_lodging_needed!==null&&g.prev_lodging_needed!==undefined) setLodging(g.prev_lodging_needed);
  const messageEl=document.getElementById('r-message'); if(messageEl) messageEl.value=g.prev_message||'';
  const customEl=document.getElementById('r-custom'); if(customEl) customEl.value=g.prev_custom_answer||'';
}

function showGuestGroup(){
  const t=T[lang];
  document.getElementById('field-name-search').style.display='none';
  document.getElementById('field-name-selected').style.display='block';
  // La asistencia ahora se marca por persona, no con el toggle único
  document.getElementById('field-attending-single').style.display='none';
  const guestsField=document.getElementById('field-guests');
  if(guestsField) guestsField.style.display='none';

  const rows=groupMembers.map((m,i)=>{
    if(m.already_responded){
      return `<div class="group-member-row"><span>${esc(m.guest_name)}</span><span class="group-member-done">${t.alreadyResponded}</span></div>`;
    }
    return `<div class="group-member-row">
      <span>${esc(m.guest_name)}</span>
      <div class="attend-toggle-mini">
        <button type="button" class="mini-btn" id="grp-yes-${i}" onclick="setGroupMemberAttending(${i},true)">${t.yes}</button>
        <button type="button" class="mini-btn" id="grp-no-${i}" onclick="setGroupMemberAttending(${i},false)">${t.no}</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('selected-guest-display').innerHTML=
    `<div style="font-weight:700;margin-bottom:.6rem">${esc(groupMembers[0].group_name)}</div>${rows}`;

  const anyPending=groupMembers.some(m=>!m.already_responded);
  document.getElementById('rsvp-rest').style.display=anyPending?'block':'none';
  // En modo grupo estas preguntas son compartidas para todo el grupo (no
  // por persona) — antes se quedaban escondidas para siempre porque solo
  // setAttending() (modo individual) las revelaba.
  ['field-dietary','field-song','field-lodging','field-custom','field-message'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.style.display=anyPending?'block':'none';
  });
  document.getElementById('btn-submit').disabled=true; // se habilita cuando marquen al menos a alguien
}

function setGroupMemberAttending(i,val){
  groupMembers[i].attending=val;
  document.getElementById(`grp-yes-${i}`).classList.toggle('mini-sel-yes',val===true);
  document.getElementById(`grp-no-${i}`).classList.toggle('mini-sel-no',val===false);
  document.getElementById('btn-submit').disabled=!groupMembers.some(m=>m.attending!==null);
}

function resetGuestSearch(){
  selectedGuest=null;
  groupMembers=null;
  editingGuestListId=null;
  lastSelectedGuest=null;
  document.getElementById('field-name-search').style.display='block';
  document.getElementById('field-name-selected').style.display='none';
  document.getElementById('field-attending-single').style.display='block';
  document.getElementById('rsvp-rest').style.display='none';
  document.getElementById('r-name-search').value='';
  document.getElementById('guest-search-results').innerHTML='';
  const editBtn=document.getElementById('btn-edit-rsvp');
  if(editBtn) editBtn.style.display='none';
}

let attending=null;
let lodgingNeeded=null;
function setLodging(val){
  lodgingNeeded=val;
  document.getElementById('opt-lodging-yes').classList.toggle('sel-yes',val===true);
  document.getElementById('opt-lodging-no').classList.toggle('sel-no',val===false);
}
function setAttending(val){
  attending=val;
  document.getElementById('opt-yes').classList.toggle('sel-yes',val===true);
  document.getElementById('opt-no').classList.toggle('sel-no',val===false);
  ['field-guests','field-dietary','field-song','field-lodging','field-custom','field-message'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.style.display=(val===true)?'block':'none';
  });
  document.getElementById('btn-submit').disabled=false;
}

async function submitRSVP(e){
  e.preventDefault();
  const t=T[lang];
  const btn=document.getElementById('btn-submit');
  const isGroup=groupMembers!==null;

  // ── Modo grupo: una fila de RSVP por cada persona marcada ──
  if(isGroup){
    const pending=groupMembers.filter(m=>m.attending!==null);
    if(!pending.length){ showToast(t.toastNoAttend); return; }

    btn.disabled=true; btn.textContent=t.sendingBtn;

    const sharedEmail=document.getElementById('r-email').value.trim()||null;
    const sharedDietary=document.getElementById('r-dietary')?document.getElementById('r-dietary').value.trim():null;
    const sharedSong=document.getElementById('r-song')?document.getElementById('r-song').value.trim():null;
    const sharedLodging=document.getElementById('field-lodging')?lodgingNeeded:null;
    const sharedMessage=document.getElementById('r-message')?document.getElementById('r-message').value.trim():null;
    const sharedCustom=document.getElementById('r-custom')?document.getElementById('r-custom').value.trim():null;

    const payloads=pending.map(m=>({
      invitation_id: invitation.id,
      guest_list_id: m.id,
      guest_name: m.guest_name,
      guest_email: sharedEmail,
      attending: m.attending,
      guest_count: 0,
      dietary: sharedDietary,
      song_request: sharedSong,
      lodging_needed: sharedLodging,
      message: sharedMessage,
      custom_answer: sharedCustom
    }));

    const {error}=await anonInsertRsvps(payloads);
    if(error){
      showToast(t.toastError);
      btn.disabled=false; btn.textContent=t.confirmBtn;
      return;
    }
    if(document.activeElement) document.activeElement.blur();
    renderThanksScreen(pending.some(m=>m.attending===true));
    return;
  }

  // ── Modo individual (comportamiento existente) ──
  const restricted=!!invitation.restrict_to_guest_list;
  const name=restricted?(selectedGuest?selectedGuest.guest_name:''):document.getElementById('r-name').value.trim();
  if(!name){ showToast(t.toastNoName); return; }
  if(attending===null){ showToast(t.toastNoAttend); return; }

  btn.disabled=true; btn.textContent=t.sendingBtn;

  // ── Editando una respuesta ya existente — vía la función segura, no un insert nuevo ──
  if(editingGuestListId){
    const {data,error}=await anonUpdateMyRsvp({
      p_guest_list_id: editingGuestListId,
      p_attending: attending,
      p_guest_email: document.getElementById('r-email').value.trim()||null,
      p_guest_count: document.getElementById('r-guests')?parseInt(document.getElementById('r-guests').value)||0:null,
      p_dietary: document.getElementById('r-dietary')?document.getElementById('r-dietary').value.trim():null,
      p_song_request: document.getElementById('r-song')?document.getElementById('r-song').value.trim():null,
      p_lodging_needed: document.getElementById('field-lodging')?lodgingNeeded:null,
      p_message: document.getElementById('r-message')?document.getElementById('r-message').value.trim():null,
      p_custom_answer: document.getElementById('r-custom')?document.getElementById('r-custom').value.trim():null
    });
    if(error||!data?.success){
      showToast(t.toastError);
      btn.disabled=false; btn.textContent=t.confirmBtn;
      return;
    }
    if(document.activeElement) document.activeElement.blur();
    showToast(t.editSaved);
    renderThanksScreen(attending);
    return;
  }

  const payload={
    invitation_id: invitation.id,
    guest_list_id: restricted&&selectedGuest?selectedGuest.id:null,
    guest_name: name,
    guest_email: document.getElementById('r-email').value.trim()||null,
    attending,
    guest_count: document.getElementById('r-guests')?parseInt(document.getElementById('r-guests').value)||0:null,
    dietary: document.getElementById('r-dietary')?document.getElementById('r-dietary').value.trim():null,
    song_request: document.getElementById('r-song')?document.getElementById('r-song').value.trim():null,
    lodging_needed: document.getElementById('field-lodging')?lodgingNeeded:null,
    message: document.getElementById('r-message')?document.getElementById('r-message').value.trim():null,
    custom_answer: document.getElementById('r-custom')?document.getElementById('r-custom').value.trim():null
  };

  const {error}=await anonInsertRsvps([payload]);
  if(error){
    showToast(t.toastError);
    btn.disabled=false; btn.textContent=t.confirmBtn;
    return;
  }

  if(document.activeElement) document.activeElement.blur();
  renderThanksScreen(attending);
}

// ── Galería de fotos del evento (subida por los invitados) ──
let eventPhotosList=[];
const GALLERY_PREVIEW_COUNT=6; // cuántas miniaturas se muestran en la tarjeta principal

async function loadEventPhotos(){
  if(!invitation) return;
  const {data,error}=await sb.from('event_photos').select('id,photo_url,uploaded_by_name,uploader_token').eq('invitation_id',invitation.id).order('created_at',{ascending:false});
  const gallery=document.getElementById('event-photos-gallery');
  const emptyMsg=document.getElementById('event-photos-empty');
  const viewAllBtn=document.getElementById('event-photos-viewall');
  const downloadAllBtn=document.getElementById('event-photos-downloadall');
  if(!gallery) return;
  if(error||!data||!data.length){
    eventPhotosList=[];
    gallery.innerHTML='';
    if(emptyMsg) emptyMsg.style.display='block';
    if(viewAllBtn) viewAllBtn.style.display='none';
    if(downloadAllBtn) downloadAllBtn.style.display='none';
    return;
  }
  if(emptyMsg) emptyMsg.style.display='none';
  eventPhotosList=data;
  const preview=data.slice(0,GALLERY_PREVIEW_COUNT);
  gallery.innerHTML=preview.map((p,i)=>galleryThumbHTML(p,i)).join('');
  if(viewAllBtn){
    const L=lang==='es';
    if(data.length>0){
      viewAllBtn.style.display='inline-block';
      viewAllBtn.textContent=L3(`🖼️ Ver todas las fotos (${data.length})`,`🖼️ View all photos (${data.length})`,`🖼️ Voir toutes les photos (${data.length})`);
    } else {
      viewAllBtn.style.display='none';
    }
  }
  if(downloadAllBtn){
    if(data.length>0){
      downloadAllBtn.style.display='inline-block';
      downloadAllBtn.textContent='⬇️ '+T[lang].downloadAllBtn;
    } else {
      downloadAllBtn.style.display='none';
    }
  }
}

function galleryThumbHTML(p,i){
  const canDelete=isHost||(p.uploader_token&&p.uploader_token===getUploaderToken());
  const deleteBtn=canDelete?`<button type="button" onclick="event.stopPropagation();deleteEventPhoto('${p.id}')" title="${T[lang].confirmDeletePhoto}" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;padding:0">✕</button>`:'';
  return `
    <div style="position:relative">
      <img src="${esc(p.photo_url)}" class="gallery-img" loading="lazy" onclick="openPhotoLightbox(${i})" style="cursor:pointer">
      <a href="${esc(p.photo_url)}" download target="_blank" rel="noopener" style="position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;text-decoration:none">⬇</a>
      ${deleteBtn}
    </div>
  `;
}

// Borra una foto de la galería — de la base de datos Y del archivo real en
// Storage (sin esto, el registro desaparece pero el archivo queda huérfano
// ocupando espacio para siempre). Mismo nivel de confianza que subir fotos:
// cualquiera con el link puede borrar cualquier foto, ya que no se rastrea
// identidad de invitado a nivel de cuenta.
async function deleteEventPhoto(photoId){
  const t=T[lang];
  if(!confirm(t.confirmDeletePhoto)) return;
  try{
    const {data,error}=await sb.rpc('delete_event_photo',{p_photo_id:photoId,p_uploader_token:getUploaderToken()});
    if(error||!data?.success){
      showToast(t.photoDeleteError);
      return;
    }

    closePhotoLightbox();
    loadEventPhotos();
    // Si el modal de galería completa está abierto, refrescarlo también
    const overlay=document.getElementById('full-gallery-overlay');
    if(overlay&&overlay.style.display!=='none'&&overlay.innerHTML) openFullGalleryView();
    showToast(t.photoDeleted);
  }catch(e){
    console.error('Error borrando la foto:',e);
    showToast(t.photoDeleteError);
  }
}

// único modo de guardarlas era una por una con el botón ⬇ de cada miniatura,
// tedioso en cuanto hay más de un puñado de fotos.
async function downloadAllEventPhotos(){
  const t=T[lang];
  if(!eventPhotosList.length) return;
  if(typeof JSZip==='undefined'){ showToast(t.downloadZipError); return; }

  const btns=[...document.querySelectorAll('.photos-downloadall-btn')];
  if(!btns.length) return;
  if(btns[0].disabled) return; // ya en proceso — evita doble clic en cualquiera de los dos botones
  const originalLabels=btns.map(b=>b.textContent);
  btns.forEach(b=>{ b.disabled=true; b.style.opacity='.6'; b.style.cursor='wait'; });
  showToast(t.downloadingZip);

  try{
    const zip=new JSZip();
    let done=0;
    for(const photo of eventPhotosList){
      try{
        const res=await fetch(photo.photo_url);
        if(!res.ok) throw new Error('fetch failed: '+res.status);
        const blob=await res.blob();
        const ext=(photo.photo_url.split('.').pop()||'jpg').split('?')[0].slice(0,4);
        zip.file(`foto-${String(done+1).padStart(3,'0')}.${ext}`,blob);
      }catch(e){
        // Una foto que falle (link roto, red lenta) no debe tronar la
        // descarga completa — se omite y seguimos con las demás.
        console.error('No se pudo incluir una foto en el zip:',e);
      }
      done++;
      const label=t.downloadZipProgress(Math.round((done/eventPhotosList.length)*100));
      btns.forEach(b=>{ b.textContent=label; });
    }

    const content=await zip.generateAsync({type:'blob'});
    const url=URL.createObjectURL(content);
    const a=document.createElement('a');
    a.href=url;
    a.download=`fotos-${(invitation?.host_names||'evento').replace(/[^\w]+/g,'-')}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast(t.downloadZipDone);
  }catch(e){
    console.error('Error generando el zip de fotos:',e);
    showToast(t.downloadZipError);
  }finally{
    btns.forEach((b,i)=>{ b.disabled=false; b.style.opacity=''; b.style.cursor=''; b.textContent=originalLabels[i]; });
  }
}

function openFullGalleryView(){
  const L=lang==='es';
  let overlay=document.getElementById('full-gallery-overlay');
  if(!overlay){
    overlay=document.createElement('div');
    overlay.id='full-gallery-overlay';
    overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:250;display:flex;align-items:center;justify-content:center;padding:20px';
    overlay.onclick=(e)=>{ if(e.target===overlay) closeFullGalleryView(); };
    document.body.appendChild(overlay);
  }
  overlay.innerHTML=`
    <div style="background:#fff;border-radius:16px;padding:1.5rem;max-width:900px;width:100%;max-height:88vh;overflow-y:auto;box-sizing:border-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:10px;flex-wrap:wrap">
        <h3 style="font-family:'Cormorant Garamond',serif;font-size:20px;margin:0">${L3('Todas las fotos','All photos','Toutes les photos')} (${eventPhotosList.length})</h3>
        <div style="display:flex;align-items:center;gap:8px">
          <button type="button" class="extra-link-btn photos-downloadall-btn" style="border:none;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap" onclick="downloadAllEventPhotos()">⬇️ ${L3('Descargar todas','Download all','Tout télécharger')}</button>
          <button type="button" onclick="closeFullGalleryView()" style="background:var(--cream-2);border:none;border-radius:50%;width:32px;height:32px;font-size:15px;cursor:pointer;flex-shrink:0">✕</button>
        </div>
      </div>
      <div class="gallery-grid" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">
        ${eventPhotosList.map((p,i)=>galleryThumbHTML(p,i)).join('')}
      </div>
    </div>
  `;
}

function closeFullGalleryView(){
  const overlay=document.getElementById('full-gallery-overlay');
  if(overlay) overlay.remove();
}

let lightboxIndex=0;
function openPhotoLightbox(index){
  lightboxIndex=index;
  renderLightbox();
  document.addEventListener('keydown',lightboxKeyHandler);
}

function lightboxKeyHandler(e){
  if(e.key==='Escape') closePhotoLightbox();
  if(e.key==='ArrowRight') navLightbox(1);
  if(e.key==='ArrowLeft') navLightbox(-1);
}

function navLightbox(delta){
  const n=eventPhotosList.length;
  if(!n) return;
  lightboxIndex=(lightboxIndex+delta+n)%n;
  renderLightbox();
}

function closePhotoLightbox(){
  const overlay=document.getElementById('photo-lightbox-overlay');
  if(overlay) overlay.remove();
  document.removeEventListener('keydown',lightboxKeyHandler);
}

function renderLightbox(){
  const n=eventPhotosList.length;
  if(!n) return;
  const p=eventPhotosList[lightboxIndex];
  let overlay=document.getElementById('photo-lightbox-overlay');
  if(!overlay){
    overlay=document.createElement('div');
    overlay.id='photo-lightbox-overlay';
    overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
    overlay.onclick=(e)=>{ if(e.target===overlay) closePhotoLightbox(); };
    document.body.appendChild(overlay);
  }
  const navBtn=(dir,label)=>`<button type="button" onclick="event.stopPropagation();navLightbox(${dir})" style="position:absolute;top:50%;${dir<0?'left':'right'}:16px;transform:translateY(-50%);background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center">${label}</button>`;
  const canDelete=isHost||(p.uploader_token&&p.uploader_token===getUploaderToken());
  const deleteBtn=canDelete?`<button type="button" onclick="event.stopPropagation();deleteEventPhoto('${p.id}')" title="${T[lang].confirmDeletePhoto}" style="position:absolute;top:16px;right:60px;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:15px;cursor:pointer">🗑️</button>`:'';
  overlay.innerHTML=`
    <button type="button" onclick="event.stopPropagation();closePhotoLightbox()" style="position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer">✕</button>
    ${deleteBtn}
    ${n>1?navBtn(-1,'‹'):''}
    <img src="${esc(p.photo_url)}" style="max-width:100%;max-height:85vh;border-radius:8px;object-fit:contain" onclick="event.stopPropagation()">
    ${n>1?navBtn(1,'›'):''}
    ${n>1?`<div style="position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#fff;font-size:12px;opacity:.8">${lightboxIndex+1} / ${n}</div>`:''}
  `;
}

async function uploadEventPhotos(event){
  const files=Array.from(event.target.files||[]);
  event.target.value='';
  if(!files.length||!invitation) return;
  const t=T[lang];

  let uploaded=0;
  for(const file of files){
    if(!file.type.startsWith('image/')) continue;
    if(file.size>8*1024*1024) continue; // máximo 8 MB por foto

    const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
    const path=`${invitation.id}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
    const {error:upErr}=await sb.storage.from('event-photos').upload(path,file,{upsert:false});
    if(upErr){ console.error(upErr); continue; }

    const {data:urlData}=sb.storage.from('event-photos').getPublicUrl(path);
    if(!urlData?.publicUrl) continue;

    const {error:insErr}=await sb.from('event_photos').insert({invitation_id:invitation.id,photo_url:urlData.publicUrl,uploader_token:getUploaderToken()});
    if(!insErr) uploaded++;
  }

  if(uploaded>0){ showToast(t.photoUploaded); loadEventPhotos(); }
}

async function init(){
  if(!sb){ renderNotFound(); return; }
  const slug=getSlug();
  if(!slug){ renderNotFound(); return; }

  // La tabla invitations ya no es legible directo (evita que cualquiera
  // pueda enumerar todas las invitaciones de la plataforma). Este RPC
  // solo entrega datos si conoces el slug exacto.
  const {data,error}=await sb.rpc('get_public_invitation',{p_slug:slug});
  const row=Array.isArray(data)&&data[0];
  if(error||!row){ renderNotFound(); return; }

  invitation=row;

  // ¿El visitante ya inició sesión en la app principal en este mismo
  // navegador? Si es el dueño de ESTA invitación, puede borrar cualquier
  // foto de la galería, no solo las que él mismo subió.
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session?.user){
      const {data:ownerCheck}=await sb.rpc('is_invitation_owner',{p_invitation_id:invitation.id});
      isHost=!!ownerCheck;
      // Si hay una sesión pero NO es la del dueño de esta invitación (ej. un
      // invitado que alguna vez probó el generador de planes en este mismo
      // navegador, y esa sesión ya expiró), la cerramos solo localmente para
      // que no se le pegue un token vencido a su RSVP, que es anónimo por
      // diseño. scope:'local' no afecta su sesión real en /app.
      if(!isHost) await sb.auth.signOut({scope:'local'});
    }
  }catch(e){ console.error('No se pudo verificar si es el anfitrión:',e); }

  renderInvitation(row);
  loadEventPhotos();
}

// Autoreparación (ver index.html/dragonflai-v2.html para el detalle
// completo): esta página nunca registra su propio service worker, pero si
// el navegador tiene uno viejo con alcance de raíz (de antes de que se
// acotara a /app), lo quita para que no intercepte las peticiones de esta
// invitación pública.
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(reg=>{
      try{
        if(new URL(reg.scope).pathname==='/') reg.unregister();
      }catch(e){}
    });
  }).catch(()=>{});
}

// Aplicar el idioma resuelto antes de pedir la invitación, para que el
// estado de carga y un posible "no encontrada" ya salgan en el idioma
// correcto en el primer pintado.
setLang(lang);
init();
</script>
